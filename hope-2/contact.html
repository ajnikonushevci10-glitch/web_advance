<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Hope Clothing</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/solid.min.css">
</head>
<body>

<div class="header">
  <div class="container">
    <div class="navbar">
      <div class="logo"><img src="images/logo.jpg" alt="Hope logo"></div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <a href="#" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></a>
    </div>
  </div>
</div>

<div class="small container">
  <div class="row contact-grid">
    <div>
      <h2 style="font-size:1.6rem; margin-bottom:6px;">Get in touch</h2>
      <p style="color:var(--muted); margin-bottom:24px;">Questions about an order, sizing, or a piece you want to see next? Drop a message below. We read every message ourselves.</p>
      <form action="#" onsubmit="return false;">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="btn" style="align-self:flex-start; cursor:pointer;">Send Message</button>
      </form>
    </div>
    <div>
      <h2 style="font-size:1.6rem; margin-bottom:16px;">Find us</h2>
      <div class="field" style="margin-bottom:20px;">
        <label>Email</label>
        <p>hello@hope.com</p>
      </div>
      <div class="field" style="margin-bottom:20px;">
        <label>Response time</label>
        <p>1–2 business days</p>
      </div>
      <div class="field">
        <label>Socials</label>
        <p>@hope on Instagram</p>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="container" style="display:flex; justify-content:space-between; width:100%; flex-wrap:wrap; gap:12px;">
    <span>© Hope</span>
    <span>Built with HTML &amp; CSS</span>
  </div>
</footer>

</body>
</html>
